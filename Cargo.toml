[workspace]
members = [".", "crates/kohdalab-control-protocol"]
resolver = "3"

[workspace.package]
rust-version = "1.92"

[package]
name = "kohdalab-shutter"
version = "1.0.0"
edition = "2024"
rust-version.workspace = true
description = "Rust desktop controller for the KohdaLab Pico W shutter"
license = "MIT"
default-run = "kohdalab-shutter-gui"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:image"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
kohdalab-control-protocol = { path = "crates/kohdalab-control-protocol" }
eframe = { version = "0.35.0", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

image = { version = "0.25", optional = true, default-features = false, features = ["png"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"

[[bin]]
name = "kohdalab-shutter"
path = "src/bin/cli.rs"

[[bin]]
name = "kohdalab-shutter-gui"
path = "src/bin/gui.rs"
required-features = ["gui"]
