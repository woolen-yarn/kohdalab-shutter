[package]
name = "kohdalab-shutter"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "Rust desktop controller for the KohdaLab Pico W shutter"
license = "MIT"
default-run = "kohdalab-shutter-gui"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:image"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
eframe = { version = "0.33.3", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

image = { version = "0.25", optional = true, default-features = false, features = ["png"] }

[[bin]]
name = "kohdalab-shutter"
path = "src/bin/cli.rs"

[[bin]]
name = "kohdalab-shutter-gui"
path = "src/bin/gui.rs"
required-features = ["gui"]
