name: Build Linux packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu-x64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install GUI build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev libegl1-mesa-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libgl1-mesa-dri xvfb xauth
      - name: Build, package and test
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: bash scripts/package_linux.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shutter-linux-x86_64
          path: dist/linux/*
          if-no-files-found: error
