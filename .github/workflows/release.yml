name: Build desktop releases

on:
  pull_request:
    paths:
      - '.gitattributes'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - '.github/workflows/release.yml'
      - 'scripts/package_release.py'
      - 'tests/test_release_package.py'
      - 'assets/dependency-licenses/**'
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Package / ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: windows-x64
          - os: macos-15
            platform: macos-universal
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: '-C target-feature=+crt-static'
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Cache native Rust builds
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: desktop-${{ matrix.platform }}
          cache-on-failure: true
      - name: Verify release tag matches application version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -c "import os,pathlib,tomllib; v=tomllib.loads(pathlib.Path('Cargo.toml').read_text())['package']['version']; assert os.environ['RELEASE_TAG']=='v'+v, 'Tag does not match Cargo.toml'"
      - name: Test native application
        run: cargo +stable test --locked --all-targets
      - name: Build Windows application with static runtime
        if: runner.os == 'Windows'
        run: cargo +stable build --release --locked --target x86_64-pc-windows-msvc
      - name: Prepare Windows binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/release | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/kohdalab-shutter*.exe build/release/
          foreach ($file in Get-ChildItem build/release/*.exe) {
            $bytes = [System.IO.File]::ReadAllBytes($file.FullName)
            if ([Text.Encoding]::ASCII.GetString($bytes) -match '(?i)(vcruntime|msvcp)140[^\x00]*\.dll') {
              throw "External Visual C++ runtime dependency: $file"
            }
          }
      - name: Build both Mac architectures
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin --toolchain stable
          cargo +stable build --release --locked --target aarch64-apple-darwin
          cargo +stable build --release --locked --target x86_64-apple-darwin
          mkdir -p build/release
          for binary in kohdalab-shutter-gui kohdalab-shutter; do
            lipo -create "target/aarch64-apple-darwin/release/$binary" "target/x86_64-apple-darwin/release/$binary" -output "build/release/$binary"
          done
      - name: Collect dependency licensing metadata
        run: cargo +stable metadata --locked --format-version 1 > build-metadata.json
      - name: Package and verify native apps
        run: python scripts/package_release.py --platform ${{ matrix.platform }} --binaries build/release --metadata build-metadata.json --output dist
      - name: Upload release candidates
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        with:
          name: desktop-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*.zip
            dist/*.dmg
            dist/BUILD-*.json

  intel-smoke:
    name: Verify packaged Mac app / Intel
    needs: build
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - name: Download universal Mac archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.0
        with:
          name: desktop-macos-universal
          path: artifacts
      - name: Run the packaged Intel binaries
        run: |
          ditto -x -k artifacts/*.zip extracted
          app=$(find extracted -maxdepth 2 -name 'KohdaLab Shutter.app' -type d)
          test -n "$app"
          codesign --verify --deep --strict "$app"
          "$app/Contents/MacOS/kohdalab-shutter" --version
          "$app/Contents/MacOS/kohdalab-shutter-gui" --help

  publish:
    name: Publish verified desktop release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, intel-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Check out release notes
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Resolve the tag target commit
        run: echo "RELEASE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Require the complete tag validation suite
        run: |
          for attempt in $(seq 1 10); do
            run_id=$(gh run list --workflow test.yml --commit "$RELEASE_COMMIT" --event push --branch "$RELEASE_TAG" --json databaseId --jq '.[0].databaseId // empty')
            if [ -n "$run_id" ]; then break; fi
            sleep 6
          done
          test -n "$run_id"
          gh run watch "$run_id" --exit-status --interval 30
      - name: Download release candidates
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.0
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets
      - name: Verify candidate origins and create checksums
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path('release-assets')
          tag = os.environ['RELEASE_TAG']
          expected = {f'kohdalab-shutter-{tag[1:]}-windows-x64.zip', f'kohdalab-shutter-{tag[1:]}-macos-universal.zip', f'kohdalab-shutter-{tag[1:]}-macos-universal.dmg'}
          actual = {p.name for p in root.iterdir() if p.suffix in ('.zip', '.dmg')}
          assert actual == expected, (actual, expected)
          validated = set()
          for report in root.glob('BUILD-*.json'):
              data = json.loads(report.read_text())
              assert data['commit'] == os.environ['RELEASE_COMMIT']
              assert data['version'] == tag[1:]
              for name, digest in data['assets'].items():
                  assert name in expected
                  assert hashlib.sha256((root / name).read_bytes()).hexdigest() == digest
                  validated.add(name)
          assert validated == expected
          (root / 'SHA256SUMS.txt').write_text(''.join(hashlib.sha256((root / name).read_bytes()).hexdigest() + '  ' + name + '\n' for name in sorted(expected)))
          PY
      - name: Create draft and verify uploaded files before publishing
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "KohdaLab Shutter $RELEASE_TAG" --notes-file docs/release-notes.md release-assets/*
          mkdir downloaded
          gh release download "$RELEASE_TAG" --dir downloaded
          (cd downloaded && sha256sum --check SHA256SUMS.txt)
          gh release edit "$RELEASE_TAG" --draft=false --latest
