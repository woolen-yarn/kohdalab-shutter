[project]
name = "kohdalab-shutter"
version = "0.2.0"
description = "PC-side tools for a Pico W servo shutter controller"
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "KohdaLab" }]
keywords = ["laboratory-automation", "optical-shutter", "pico-w", "servo"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "mpremote>=1.25.0",
]

[project.urls]
Documentation = "https://github.com/woolen-yarn/kohdalab-shutter/tree/main/docs"
Issues = "https://github.com/woolen-yarn/kohdalab-shutter/issues"
Repository = "https://github.com/woolen-yarn/kohdalab-shutter"

[project.optional-dependencies]
gui = [
    "pyside6>=6.11.1",
]

[project.scripts]
kohdalab-shutter = "client.cli:main"
kohdalab-shutter-gui = "client.gui:main"

[tool.uv]
python-preference = "only-managed"
python-downloads = "automatic"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["client"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "B", "PIE", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"server/main.py" = ["B905", "S104", "S110"]
"server/wifi_config.example.py" = ["S105"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["client/protocol.py", "client/transport.py", "client/cli.py"]
show_error_codes = true
warn_unused_ignores = true

[tool.coverage.run]
branch = true
relative_files = true
source = ["client", "server"]
omit = ["client/gui.py", "server/main.py", "server/settings.py"]

[tool.coverage.report]
fail_under = 100
precision = 2
show_missing = true

[tool.pytest.ini_options]
minversion = "9.0"
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]
pythonpath = ["."]
xfail_strict = true
filterwarnings = ["error"]
required_plugins = ["pytest-cov>=7.0"]

[dependency-groups]
dev = [
    "mypy",
    "pip-audit",
    "pyside6>=6.11.1",
    "pytest",
    "pytest-cov",
    "ruff",
]
package = [
    "check-wheel-contents",
    "twine",
]
