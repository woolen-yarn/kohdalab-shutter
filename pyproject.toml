[project]
name = "kohdalab-shutter"
version = "0.1.0"
description = "PC-side tools for a Pico W servo shutter controller"
requires-python = ">=3.13,<3.14"
dependencies = [
    "mpremote>=1.25.0",
    "pyside6>=6.11.1",
]

[tool.uv]
package = false
python-preference = "only-managed"
python-downloads = "automatic"
